<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <pattern id="grid-pattern-1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222222" stroke-width="0.75" />
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" />
  <rect width="800" height="500" fill="url(#grid-pattern-1)" opacity="0.6" />
  
  <!-- Editor / Mockup Window Frame -->
  <rect x="70" y="55" width="660" height="390" rx="8" fill="#181818" stroke="#333333" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="70" y="55" width="660" height="38" rx="8" fill="#202020" />
  <rect x="70" y="85" width="660" height="8" fill="#202020" />
  <line x1="70" y1="93" x2="730" y2="93" stroke="#2d2d2d" stroke-width="1" />
  <circle cx="95" cy="74" r="5" fill="#444444" />
  <circle cx="112" cy="74" r="5" fill="#333333" />
  <circle cx="129" cy="74" r="5" fill="#333333" />
  <text x="400" y="78" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" text-anchor="middle" letter-spacing="1">ARCH // DISTRIBUTED_ENGINE.PY</text>
  
  <!-- Content Mockup: Code & Visual Graph -->
  <!-- Left Column: Code / Terminal -->
  <rect x="95" y="115" width="280" height="295" rx="4" fill="#0d0d0d" stroke="#262626" stroke-width="1" />
  <text x="115" y="145" fill="#888888" font-family="monospace" font-size="11">01</text>
  <text x="140" y="145" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">class</text>
  <text x="180" y="145" fill="#cccccc" font-family="monospace" font-size="11">ExecutionEngine:</text>
  
  <text x="115" y="170" fill="#888888" font-family="monospace" font-size="11">02</text>
  <text x="140" y="170" fill="#666666" font-family="monospace" font-size="11">  """High-throughput cluster core"""</text>
  
  <text x="115" y="195" fill="#888888" font-family="monospace" font-size="11">03</text>
  <text x="140" y="195" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">  def</text>
  <text x="170" y="195" fill="#dddddd" font-family="monospace" font-size="11">__init__(self, nodes):</text>
  
  <text x="115" y="220" fill="#888888" font-family="monospace" font-size="11">04</text>
  <text x="160" y="220" fill="#aaaaaa" font-family="monospace" font-size="11">self.nodes = nodes.init()</text>
  
  <text x="115" y="245" fill="#888888" font-family="monospace" font-size="11">05</text>
  <text x="160" y="245" fill="#aaaaaa" font-family="monospace" font-size="11">self.consensus = Raft()</text>

  <rect x="115" y="275" width="240" height="1" fill="#222222" />
  <text x="115" y="305" fill="#777777" font-family="monospace" font-size="10">> LATENCY: 0.42ms [P99]</text>
  <text x="115" y="325" fill="#777777" font-family="monospace" font-size="10">> SYSTEM_HEALTH: 99.98% OK</text>
  <text x="115" y="345" fill="#ffffff" font-family="monospace" font-size="10">> ALL NODES SYNCHRONIZED</text>
  
  <!-- Right Column: Visual Nodes Architecture -->
  <rect x="395" y="115" width="310" height="295" rx="4" fill="#0d0d0d" stroke="#262626" stroke-width="1" />
  
  <!-- Graph Connections -->
  <line x1="550" y1="180" x2="470" y2="280" stroke="#444444" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="550" y1="180" x2="630" y2="280" stroke="#444444" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="470" y1="280" x2="550" y2="350" stroke="#444444" stroke-width="1.5" />
  <line x1="630" y1="280" x2="550" y2="350" stroke="#444444" stroke-width="1.5" />

  <!-- Node 1: Primary Controller -->
  <circle cx="550" cy="180" r="30" fill="#1e1e1e" stroke="#ffffff" stroke-width="1.5" />
  <text x="550" y="184" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">NODE 0</text>
  
  <!-- Node 2: Worker A -->
  <circle cx="470" cy="280" r="26" fill="#181818" stroke="#888888" stroke-width="1" />
  <text x="470" y="284" fill="#cccccc" font-family="monospace" font-size="10" text-anchor="middle">WORKER 1</text>
  
  <!-- Node 3: Worker B -->
  <circle cx="630" cy="280" r="26" fill="#181818" stroke="#888888" stroke-width="1" />
  <text x="630" y="284" fill="#cccccc" font-family="monospace" font-size="10" text-anchor="middle">WORKER 2</text>
  
  <!-- Node 4: Consensus Sync -->
  <rect x="505" y="335" width="90" height="30" rx="4" fill="#222222" stroke="#ffffff" stroke-width="1" />
  <text x="550" y="354" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">DATA REPO</text>

  <!-- Editorial Monogram stamp in corner -->
  <text x="710" y="430" fill="#444444" font-family="monospace" font-size="9" text-anchor="end">FIG. 01 — SYSTEMS ARCHITECTURE</text>
</svg>
